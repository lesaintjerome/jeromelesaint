[project]
name = "jeromelesaint"
version = "0.1.0"
description = "Personal MkDocs site for jeromelesaint."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-encryptcontent-plugin>=3.0",
    "pymdown-extensions>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
